<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin - sign up form</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/boilerplate.css" />
    <style>
      @font-face {
        font-family: "Norse bold";
        src: url("./fonts/Norse-Bold.otf") format("opentype");
        font-display: block;
      }

      .visual {
        font-family: "Norse bold", Arial, Helvetica, sans-serif;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="app__visual">
        <div class="visual">
          <img
            class="visual__logo"
            src="./images/odin-lined.png"
            alt="Odin logo"
          />
          <h1 class="visual__name">Odin</h1>
        </div>
        <div class="cheers">
          Photo by
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
            >Hallie West</a
          >
          on Unsplash
        </div>
      </section>

      <!-- Right section of the app -->
      <section class="app__main"></section>
    </div>
  </body>
</html>
